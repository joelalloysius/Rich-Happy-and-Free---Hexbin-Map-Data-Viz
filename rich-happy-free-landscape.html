<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rich, Happy and Free? (landscape)</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
/* ---------- Colour scheme: clean white, European architecture ---------- */
:root {
  --bg:       #FFFFFF;   /* canvas background */
  --tile:     #F2F1EE;   /* hexagon and panel fill: pale stone */
  --ink:      #1F1F1F;   /* main text */
  --ink-soft: #6B6B6B;   /* secondary text */
  --hdi:      #B8512F;   /* development column: terracotta roof tiles */
  --happy:    #D49A2A;   /* happiness column: ochre facades */
  --free:     #3F8E7E;   /* freedom column: verdigris copper domes */
}

/* ---------- Page ---------- */
body {
  margin: 0;
  padding: 0;
  background: #FFFFFF;
  display: flex;
  justify-content: center;
  font-family: "Helvetica Neue", Arial, sans-serif;
}

#frame {
  width: 950px;
  max-width: 100%;
}

/* ---------- Canvas ---------- */
.background {
  fill: var(--bg);
}

/* ---------- Title and subtitle ---------- */
.title {
  fill: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 50px;
  font-weight: 600;
}

.subtitle {
  fill: var(--ink-soft);
  font-size: 16px;
}

/* ---------- Legend ---------- */
.legend-label {
  fill: var(--ink-soft);
  font-size: 15px;
}

/* ---------- Panel ---------- */
.panel {
  fill: var(--tile);
}

.panel-name {
  fill: var(--ink);
  font-size: 28px;
  font-weight: 600;
}

.panel-label {
  fill: var(--ink-soft);
  font-size: 14px;
}

.panel-number {
  fill: var(--ink);
  font-size: 26px;
  font-weight: 600;
  text-anchor: end;
}

/* ---------- Hexagons ---------- */
.country {
  cursor: pointer;
}

.tile {
  fill: var(--tile);
  stroke: transparent;
  stroke-width: 3;
}

/* outline the hexagon you're hovering over */
.country.active .tile {
  stroke: var(--ink);
}

.code {
  fill: var(--ink);
  font-size: 17px;
  font-weight: 600;
  text-anchor: middle;
}

/* ---------- Columns (also used by the legend and panel bars) ---------- */
.hdi {
  fill: var(--hdi);
}

.happy {
  fill: var(--happy);
}

.free {
  fill: var(--free);
}

.baseline {
  stroke: var(--ink-soft);
  stroke-width: 1.5;
  stroke-opacity: 0.5;
}

/* ---------- Sources ---------- */
.source {
  fill: var(--ink-soft);
  font-size: 11px;
}

  </style>
</head>
<body>
  <div id="frame"></div>

  <script>
// =====================================================
// 0. Data (same as data.csv)
// =====================================================
const DATA_CSV = `
code,name,hdi,happiness,freedom,col,row
IS,Iceland,0.972,7.540,95,0,0
NO,Norway,0.970,7.242,99,4,0
SE,Sweden,0.959,7.255,99,5,0
FI,Finland,0.948,7.764,100,6,0
EE,Estonia,0.905,6.410,96,6,1
RU,Russia,0.832,5.834,12,7,1
IE,Ireland,0.949,6.928,98,0,2
GB,United Kingdom,0.946,6.694,92,1,2
DK,Denmark,0.962,7.539,97,4,2
LV,Latvia,0.889,6.365,89,6,2
NL,Netherlands,0.955,7.223,97,2,3
DE,Germany,0.959,6.882,95,3,3
PL,Poland,0.906,6.768,82,4,3
LT,Lithuania,0.895,6.704,90,5,3
BY,Belarus,0.824,5.821,7,6,3
BE,Belgium,0.951,6.926,95,2,4
LU,Luxembourg,0.922,7.063,97,3,4
CZ,Czechia,0.915,6.821,95,4,4
SK,Slovakia,0.880,6.255,88,5,4
UA,Ukraine,0.779,4.658,51,6,4
FR,France,0.920,6.586,89,2,5
CH,Switzerland,0.970,7.018,96,3,5
AT,Austria,0.930,6.845,94,4,5
HU,Hungary,0.870,5.937,65,5,5
RO,Romania,0.845,6.629,83,6,5
MD,Moldova,0.785,5.851,60,7,5
PT,Portugal,0.890,6.029,96,0,6
ES,Spain,0.918,6.540,91,1,6
AD,Andorra,0.913,,93,2,6
IT,Italy,0.915,6.574,87,3,6
SI,Slovenia,0.931,6.868,97,4,6
HR,Croatia,0.889,6.009,82,5,6
RS,Serbia,0.833,6.691,53,6,6
MC,Monaco,,,82,2,7
LI,Liechtenstein,0.938,,90,3,7
BA,Bosnia and Herzegovina,0.804,6.381,54,4,7
ME,Montenegro,0.862,6.139,68,5,7
XK,Kosovo,,6.910,61,6,7
BG,Bulgaria,0.845,5.703,74,7,7
TR,Türkiye,0.853,5.300,32,8,7
SM,San Marino,0.915,,97,3,8
MT,Malta,0.924,6.436,88,4,8
AL,Albania,0.810,5.662,69,5,8
MK,North Macedonia,0.815,5.719,67,6,8
GR,Greece,0.908,5.697,85,6,9
CY,Cyprus,0.913,6.126,90,8,9
`.trim();

// =====================================================
// 1. Canvas: landscape, 950 x 590
// =====================================================
const svg = d3.select("#frame")
  .append("svg")
  .attr("viewBox", "0 0 950 590")
  .attr("width", "100%");

svg.append("rect")
  .attr("class", "background")
  .attr("width", 950)
  .attr("height", 590);


// =====================================================
// 2. Title and subtitle (left column, split over two lines)
// =====================================================
svg.append("text")
  .attr("class", "title")
  .attr("x", 40)
  .attr("y", 82)
  .text("Rich, Happy");

svg.append("text")
  .attr("class", "title")
  .attr("x", 40)
  .attr("y", 138)
  .text("and Free?");

svg.append("text")
  .attr("class", "subtitle")
  .attr("x", 40)
  .attr("y", 176)
  .text("Europe's countries on development,");

svg.append("text")
  .attr("class", "subtitle")
  .attr("x", 40)
  .attr("y", 198)
  .text("happiness and freedom");


// =====================================================
// 3. Legend (stacked vertically)
// =====================================================
function addLegendItem(y, className, label) {
  svg.append("rect")
    .attr("class", className)
    .attr("x", 40)
    .attr("y", y - 11)
    .attr("width", 13)
    .attr("height", 13)
    .attr("rx", 2);

  svg.append("text")
    .attr("class", "legend-label")
    .attr("x", 62)
    .attr("y", y)
    .text(label);
}

addLegendItem(238, "hdi", "Development (HDI)");
addLegendItem(262, "happy", "Happiness");
addLegendItem(286, "free", "Freedom");


// =====================================================
// 4. Panel (Europe averages, or a country on hover)
//    one row per index: bar, label on the left, number on the right
// =====================================================
svg.append("rect")
  .attr("class", "panel")
  .attr("x", 40)
  .attr("y", 316)
  .attr("width", 290)
  .attr("height", 200)
  .attr("rx", 14);

svg.append("text")
  .attr("class", "panel-name")
  .attr("id", "panel-name")
  .attr("x", 60)
  .attr("y", 356);

function addPanelRow(y, className, label, numberId) {
  svg.append("rect")
    .attr("class", className)
    .attr("x", 60)
    .attr("y", y - 26)
    .attr("width", 4)
    .attr("height", 34);

  svg.append("text")
    .attr("class", "panel-label")
    .attr("x", 74)
    .attr("y", y - 4)
    .text(label);

  svg.append("text")
    .attr("class", "panel-number")
    .attr("id", numberId)
    .attr("x", 310)
    .attr("y", y)
    .text("–");
}

addPanelRow(404, "hdi", "Development (HDI)", "hdi-number");
addPanelRow(448, "happy", "Happiness", "happy-number");
addPanelRow(492, "free", "Freedom", "free-number");

function formatNumber(value, decimals) {
  if (value === null) {
    return "–";
  }
  return value.toFixed(decimals);
}

function showInPanel(name, hdi, happiness, freedom) {
  d3.select("#panel-name").text(name);
  d3.select("#hdi-number").text(formatNumber(hdi, 3));
  d3.select("#happy-number").text(formatNumber(happiness, 2));
  d3.select("#free-number").text(formatNumber(freedom, 0));
}


// =====================================================
// 5. Sources (bottom of the left column, two lines)
// =====================================================
svg.append("text")
  .attr("class", "source")
  .attr("x", 40)
  .attr("y", 548)
  .text("Sources: UNDP Human Development Report 2025 ·");

svg.append("text")
  .attr("class", "source")
  .attr("x", 40)
  .attr("y", 564)
  .text("World Happiness Report 2026 · Freedom House");


// =====================================================
// 6. Helpers: data, positions and column heights
// =====================================================
function toNumber(text) {
  if (text === "") {
    return null;
  }
  return Number(text);
}

// the map sits on the right; hexagons are drawn at full size
// and shrunk with TILE_SCALE so they fit the landscape canvas
const TILE_SCALE = 0.62;

// grid position (col, row) -> canvas position (x, y)
function xPosition(d) {
  let x = 405 + d.col * 58;
  if (d.row % 2 === 1) {
    x = x + 29;   // shift odd rows half a step to make the honeycomb
  }
  return x;
}

function yPosition(d) {
  return 70 + d.row * 50;
}

// scores -> column heights (0 to 43 pixels, before shrinking)
const hdiScale = d3.scaleLinear()
  .domain([0.75, 1])
  .range([0, 43])
  .clamp(true);

const happyScale = d3.scaleLinear()
  .domain([4.5, 8])
  .range([0, 43])
  .clamp(true);

const freeScale = d3.scaleLinear()
  .domain([0, 100])
  .range([0, 43])
  .clamp(true);

function hdiHeight(d) {
  if (d.hdi === null) {
    return 0;
  }
  return hdiScale(d.hdi);
}

function happyHeight(d) {
  if (d.happiness === null) {
    return 0;
  }
  return happyScale(d.happiness);
}

function freeHeight(d) {
  if (d.freedom === null) {
    return 0;
  }
  return freeScale(d.freedom);
}


// =====================================================
// 7. Read the data and draw the map
// =====================================================
const data = d3.csvParse(DATA_CSV);

(function () {

  // text -> numbers (empty cells become null)
  data.forEach(function (d) {
    d.hdi = toNumber(d.hdi);
    d.happiness = toNumber(d.happiness);
    d.freedom = toNumber(d.freedom);
    d.col = Number(d.col);
    d.row = Number(d.row);
  });

  // Europe averages (d3.mean skips missing values)
  const avgHdi = d3.mean(data, function (d) { return d.hdi; });
  const avgHappiness = d3.mean(data, function (d) { return d.happiness; });
  const avgFreedom = d3.mean(data, function (d) { return d.freedom; });

  showInPanel("Europe", avgHdi, avgHappiness, avgFreedom);

  // one group per country, moved to its place on the grid and shrunk to fit
  const countries = svg.selectAll(".country")
    .data(data)
    .join("g")
    .attr("class", "country")
    .attr("transform", function (d) {
      return "translate(" + xPosition(d) + "," + yPosition(d) + ") scale(" + TILE_SCALE + ")";
    });

  // hexagon
  countries.append("polygon")
    .attr("class", "tile")
    .attr("points", "0,-51 44,-25 44,25 0,51 -44,25 -44,-25");

  // country code
  countries.append("text")
    .attr("class", "code")
    .attr("y", -27)
    .text(function (d) {
      return d.code;
    });

  // development column
  countries.append("rect")
    .attr("class", "hdi")
    .attr("x", -25)
    .attr("width", 14)
    .attr("rx", 3)
    .attr("height", hdiHeight)
    .attr("y", function (d) {
      return 27 - hdiHeight(d);
    });

  // happiness column
  countries.append("rect")
    .attr("class", "happy")
    .attr("x", -7)
    .attr("width", 14)
    .attr("rx", 3)
    .attr("height", happyHeight)
    .attr("y", function (d) {
      return 27 - happyHeight(d);
    });

  // freedom column
  countries.append("rect")
    .attr("class", "free")
    .attr("x", 11)
    .attr("width", 14)
    .attr("rx", 3)
    .attr("height", freeHeight)
    .attr("y", function (d) {
      return 27 - freeHeight(d);
    });

  // baseline under the columns
  countries.append("line")
    .attr("class", "baseline")
    .attr("x1", -29)
    .attr("x2", 29)
    .attr("y1", 27)
    .attr("y2", 27);

  // ---------- Hover ----------
  // pointer moves onto a country: outline it and show its numbers
  countries.on("mouseenter", function (event, d) {
    d3.select(this).classed("active", true);
    showInPanel(d.name, d.hdi, d.happiness, d.freedom);
  });

  // pointer leaves: remove the outline and go back to Europe
  countries.on("mouseleave", function () {
    d3.select(this).classed("active", false);
    showInPanel("Europe", avgHdi, avgHappiness, avgFreedom);
  });
})();

  </script>
</body>
</html>
